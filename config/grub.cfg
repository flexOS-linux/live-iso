set default=0
set timeout=15

insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod all_video
insmod efi_gop
insmod efi_uga
insmod gfxterm
insmod font

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Start flexOS Live" {
    set gfxpayload=keep
    search --no-floppy --set=root --file /live/vmlinuz
    echo "Loading kernel..."
    linux /live/vmlinuz root=live:CDLABEL=FLEXOS_LIVE rd.live.image quiet splash
    echo "Loading initramfs..."
    initrd /live/initrd.img
}

menuentry "Start flexOS Live (Safe graphics)" {
    set gfxpayload=keep
    search --no-floppy --set=root --file /live/vmlinuz
    echo "Loading kernel (Safe Graphics)..."
    linux /live/vmlinuz root=live:CDLABEL=FLEXOS_LIVE rd.live.image nomodeset quiet splash
    echo "Loading initramfs..."
    initrd /live/initrd.img
}

menuentry "Start flexOS Live (Verbose / Debug)" {
    search --no-floppy --set=root --file /live/vmlinuz
    echo "Loading kernel in Verbose mode..."
    linux /live/vmlinuz root=live:CDLABEL=FLEXOS_LIVE rd.live.image systemd.debug_shell=1 debug
    echo "Loading initramfs..."
    initrd /live/initrd.img
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Boot from next volume" {
        exit
    }

    menuentry "UEFI Firmware Settings" {
        fwsetup
    }
fi
